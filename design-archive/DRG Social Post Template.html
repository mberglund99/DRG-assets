<title>DRG Social Post Template</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Cormorant+Garamond:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--teal:#12303A;--dune:#C7A97B;--linen:#F4F1EA}
*{box-sizing:border-box}
body{margin:0;background:#2a2f31}
a{color:var(--dune)}a:hover{color:var(--linen)}
.card{width:1080px;height:1080px;position:relative;overflow:hidden;background:var(--teal);font-family:"Archivo",Helvetica,sans-serif}
.card>img{position:absolute;left:0;top:0;width:1080px;height:1080px;object-fit:cover;display:block}
.card>img.logo{position:absolute;left:64px;top:56px;height:96px;width:176px;object-fit:contain}
.mono-l{font-family:"JetBrains Mono",monospace;font-size:19px;letter-spacing:.22em;text-transform:uppercase;color:var(--dune)}
.fs{position:absolute;right:64px;top:66px;text-align:right}
.bot{position:absolute;left:64px;right:64px;bottom:60px;color:var(--linen)}
.tick{height:3px;width:76px;background:var(--dune)}
.addr{font-family:"Cormorant Garamond",Georgia,serif;font-size:96px;line-height:.98;text-transform:uppercase;color:var(--linen);margin:26px 0 0}
.sub{font-family:"Cormorant Garamond",Georgia,serif;font-size:44px;line-height:1.1;text-transform:uppercase;color:var(--linen);margin-top:16px}
.meta{display:flex;gap:44px;border-top:1px solid rgba(199,169,123,.5);margin-top:34px;padding-top:26px}
.meta div{display:flex;flex-direction:column;gap:8px}
.k{font-family:"JetBrains Mono",monospace;font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:var(--dune)}
.v{font-size:25px;color:var(--linen);font-weight:500}
</style>
